<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BaydreAfrica — Built to work in the real world</title>
    <meta
      name="description"
      content="BaydreAfrica designs and builds brands, websites, and software that hold up in the real world, not just on a moodboard."
    />
    <!-- Page ground from the Figma design system, so the browser chrome and any
         pre-paint area match the design rather than flashing white. -->
    <meta name="theme-color" content="#131417" />
    <!-- Owner-supplied mark 2026-09-27. The source is 158x173, which is not
         square, so each size is padded rather than cropped: I cannot see the
         image, so nothing is allowed to cut pixels that might be the subject.
         apple-touch-icon is padded on --background because iOS renders
         transparency as black. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
